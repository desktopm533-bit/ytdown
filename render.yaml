services:
  - type: web
    name: mediadrop-web
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: MAX_FILE_MB
        value: "500"
      - key: DOWNLOAD_TIMEOUT_MS
        value: "30000"
      - key: ALLOWED_HOSTS
        value: ""
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: mediadrop-queue
          property: connectionString

  - type: worker
    name: mediadrop-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./worker/Dockerfile
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: mediadrop-queue
          property: connectionString

- type: keyvalue
  name: mediadrop-queue
  plan: free
  maxmemoryPolicy: noeviction
  ipAllowList: []
